[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Handmade macros
hungry_ayam_derive = { path = "../hungry_ayam_derive" }

# Core framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
http = "1.0"
hyper = { version = "1.0", features = ["full"] }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TypeScript generation
ts-rs = { version = "7.1.1", features = ["uuid-impl", "chrono-impl"] }

# Environment variables
dotenv = "0.15"
chrono = { version = "0.4.43", features = ["serde"] }
chrono-tz = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
webp = "0.3"
email_address = "0.2.9"
enum_stringify = "0.6.4"
argon2 = "0.5"
axum-extra = { version = "0.9", features = ["cookie"] }
rand = "0.8"
sha2 = "0.10"

# HTTP client (for external API calls)
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"

# URL parsing & lightweight regex (for menu URL scanning)
url = "2"
regex-lite = "0.1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
